# Sleek, light terminal. Tiling is done by Sway; kitty only adds tabs.

font_family      JetBrainsMono Nerd Font
font_size        11.0

# No title bar or frame; Sway draws a 1px border
hide_window_decorations yes
window_padding_width    6
confirm_os_window_close 0

# Tab bar only appears once there is a second tab
tab_bar_min_tabs        2
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           " | "
active_tab_foreground   #f3f4f5
active_tab_background   #2f343f
inactive_tab_foreground #676e7d
inactive_tab_background #14161b

# Opaque and calm: nothing that keeps the GPU busy
background          #0f1115
foreground          #e6e8ec
background_opacity  1.0
cursor_blink_interval 0
enable_audio_bell   no
visual_bell_duration 0
scrollback_lines    5000
sync_to_monitor     yes
linux_display_server wayland

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab
