exec-once = waybar & hyprpaper & firefox

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    gaps_in = 1
    gaps_out = 2

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(a0a0a0bb)
    col.inactive_border = rgba(606060aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {

    rounding = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
        size = 2
        passes = 1
        vibrancy = 0.1
    }
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    workspace_swipe = on
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}


# Default Applications

source = $HOME/.config/hypr/configs/defaults.conf

# Environment Variables

source = $HOME/.config/hypr/configs/env_varibles.conf

# Animations

source = $HOME/.config/hypr/configs/animations.conf

# Keybindings

source = $HOME/.config/hypr/configs/keybinds.conf

# Monitor Setup

source = $HOME/.config/hypr/monitors.conf